[project]
name = "conversation-grader"
version = "0.1.0"
description = "LLM-as-judge pipeline for grading sales/support conversations with LangGraph and the Claude API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Romeu Oliveira", email = "romeuow@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.50",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
grader = "grader.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "grader"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
